<html lang="en">
<head>

  <meta name="description" content="Play Glass Twist: Screw Puzzle free online. Remove screws from layered glass and match colours into boxes. No download or account needed.">
  <meta name="robots" content="noindex, follow">
  <title>Glass Twist: Screw Puzzle</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=d6ec852cafba">

  <script type="module" src="./js/app.js?v=b6a11e0a8c85"></script>
</head>
<body>
  <main id="game" class="game" data-phase="ready" aria-label="Glass Twist: Screw Puzzle">
    <header class="control-deck">
      <div class="topbar">
        <button id="pause" class="pause-button" type="button" aria-label="Pause"></button>
        <button id="level-picker" class="level-pill" type="button" aria-haspopup="dialog" aria-expanded="false"><span id="level-label"></span><span aria-hidden="true">▾</span></button>
        
      </div>
      <div id="boxes" class="boxes"></div>
      <div class="tray-meta"><span id="capacity-label"></span></div>
      <div id="tray" class="tray" role="group" aria-label="Temporary slots"></div>
    </header>
    <section class="playfield">
      <div id="progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="progress-art"></span><b id="progress-label">0%</b></div>
      <div id="board-frame" class="board-frame"><div id="board" class="board" role="group" aria-label="Glass puzzle"></div></div>
      <div id="launch" class="launch">
        <div class="launch-card">
          <h1 class="launch-title" lang="en" aria-label="Glass Twist: Screw Puzzle">Glass Twist<span>Screw Puzzle</span></h1>
          <p class="launch-tip" data-i18n="launchTip">Remove exposed screws and match three of the same colour to fill a box.</p>
          <button id="play" class="primary-button" type="button"></button>
        </div>
      </div>
      <div id="selection" class="selection" hidden><span data-i18n="selectGlass"></span><button id="cancel-selection" type="button" data-i18n="cancelSelect"></button></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
    <footer class="tool-deck">
      <div class="props">
        <button class="prop-button" id="extra" data-prop="extra" type="button"><span class="prop-icon"></span><span class="prop-label" data-i18n="extra"></span><span class="prop-badge">＋</span></button>
        <button class="prop-button" id="melt" data-prop="melt" type="button"><span class="prop-icon"></span><span class="prop-label" data-i18n="melt"></span><span class="prop-badge">＋</span></button>
      </div>
    </footer>
    <div id="celebration" class="celebration" aria-hidden="true"></div>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content" class="modal-content"></div></dialog>
  <noscript>Please enable JavaScript to play.</noscript>
</body>
</html>
